<style>
:root{--bg:#0f1020;--card:#1a1b33;--card2:#23244a;--text:#f2f2fa;--muted:#9a9cc4;--accent:#ff5c8a;--accent2:#7c5cff;--ok:#3ddc97;--ko:#ff6b6b;--r:18px}
:root.light{--bg:#f6f5fb;--card:#fff;--card2:#ecebf7;--text:#1b1b30;--muted:#6b6d90}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:radial-gradient(1200px 600px at 10% -10%,#2a1f5c55,transparent),var(--bg);color:var(--text);min-height:100vh;line-height:1.5}
button{font:inherit;cursor:pointer;border:0;color:inherit}
header{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 85%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid #ffffff12}
.logo{font-weight:800;font-size:1.2rem;background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;cursor:pointer}
nav{display:flex;gap:6px}
nav button{background:transparent;padding:8px 14px;border-radius:999px;color:var(--muted);font-weight:600}
nav button.on{background:var(--card2);color:var(--text)}
.icon{background:var(--card2);width:38px;height:38px;border-radius:50%}
main{max-width:980px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:1.9rem;margin-bottom:6px}h2{font-size:1.3rem;margin:22px 0 10px}
.sub{color:var(--muted);margin-bottom:18px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:0 8px 30px #0003;border:1px solid #ffffff0d}
.scene-card{cursor:pointer;transition:.2s;position:relative;overflow:hidden}
.scene-card:hover{transform:translateY(-4px);border-color:var(--accent2)}
.scene-card .emoji{font-size:2.2rem}
.tag{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--card2);color:var(--muted);margin-right:6px}
.tag.c2{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.bar{height:6px;border-radius:9px;background:var(--card2);margin-top:12px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.btn{background:linear-gradient(90deg,var(--accent),var(--accent2));padding:10px 18px;border-radius:999px;font-weight:700;color:#fff}
.btn.ghost{background:var(--card2);color:var(--text)}
.btn.small{padding:6px 12px;font-size:.85rem}
.stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.stat{flex:1;min-width:120px;background:var(--card);border-radius:var(--r);padding:14px;text-align:center}
.stat b{display:block;font-size:1.6rem}
.video{aspect-ratio:16/9;width:100%;border-radius:var(--r);overflow:hidden;background:#000;margin-bottom:10px}
.video iframe{width:100%;height:100%;border:0}
.vbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.vbar input{flex:1;min-width:200px;background:var(--card2);border:1px solid #ffffff15;color:var(--text);padding:9px 14px;border-radius:999px;font:inherit}
.line{display:flex;gap:12px;padding:12px 14px;border-radius:14px;margin-bottom:8px;background:var(--card);align-items:flex-start;transition:.2s}
.line.playing{background:var(--card2);box-shadow:0 0 0 2px var(--accent)}
.who{font-weight:800;min-width:78px;color:var(--accent);font-size:.85rem;padding-top:3px}
.txt{flex:1;font-size:1.08rem}
.w{cursor:pointer;border-radius:5px;padding:0 1px}.w:hover{background:#ff5c8a44}
.w.kw{border-bottom:2px dotted var(--accent2)}
.w.saved{background:#3ddc9733}
.play{background:var(--card2);width:34px;height:34px;border-radius:50%;flex:none}
.tr{color:var(--muted);font-size:.92rem;margin-top:4px;display:none}
.showtr .tr{display:block}
.panel{position:fixed;left:50%;bottom:16px;transform:translateX(-50%) translateY(150%);width:min(560px,94vw);background:var(--card);border:1px solid var(--accent2);border-radius:var(--r);padding:16px;box-shadow:0 20px 60px #0008;transition:.3s;z-index:30}
.panel.open{transform:translateX(-50%)}
.panel h3{font-size:1.3rem}.panel .def{margin:8px 0;color:var(--muted)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vocab-session{margin-bottom:22px}
.vitem{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff10}
.vitem .l{flex:1}.vitem b{font-size:1.05rem}.vitem small{color:var(--muted);display:block}
.opt{display:block;width:100%;text-align:left;background:var(--card2);padding:12px 16px;border-radius:14px;margin-top:8px;font-weight:600;border:2px solid transparent}
.opt.ok{border-color:var(--ok);background:#3ddc9722}.opt.ko{border-color:var(--ko);background:#ff6b6b22}
.fc{perspective:900px;height:230px;margin:14px 0;cursor:pointer}
.fc>div{position:relative;width:100%;height:100%;transition:.5s;transform-style:preserve-3d}
.fc.flip>div{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:var(--r);background:linear-gradient(135deg,var(--card),var(--card2));border:1px solid #ffffff15}
.fc .back{transform:rotateY(180deg)}
.fc .face b{font-size:1.7rem}
.back-link{background:none;color:var(--muted);font-weight:600;margin-bottom:12px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.chip{background:var(--card2);color:var(--muted);padding:7px 15px;border-radius:999px;font-weight:700}
.chip.on{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.w.now{background:#7c5cff77}
.tag.lv-A{background:#3ddc9722;color:var(--ok)}
.tag.lv-B{background:#4da3ff22;color:#4da3ff}
.tag.lv-C{background:linear-gradient(90deg,var(--accent),var(--accent2));color:#fff}
.play.rec{background:var(--ko);animation:pulse 1s infinite}
@keyframes pulse{50%{opacity:.55}}
.cin{background:var(--card2);color:var(--text);border:2px solid var(--accent2);border-radius:10px;padding:4px 10px;font:inherit;width:9em;text-align:center}
.lexw{font-size:1.3rem}.lexcard .def{color:var(--muted);margin:6px 0}.lexcard p i{color:var(--text);opacity:.85}
.vs{flex:1;min-width:180px;background:var(--card2);border:1px solid #ffffff15;color:var(--text);padding:8px 14px;border-radius:999px;font:inherit}
.blur .e{filter:blur(7px);cursor:pointer;transition:.2s}
.blur .line.playing .e,.blur .e:hover{filter:none}
.okw{color:var(--ok);font-weight:700}
.kow{color:var(--ko);font-weight:700;text-decoration:underline}
textarea{width:100%;background:var(--card2);color:var(--text);border:1px solid #ffffff18;border-radius:14px;padding:12px 14px;font:inherit;resize:vertical}
.empty{color:var(--muted);text-align:center;padding:40px 0}
select{background:var(--card2);color:var(--text);border:0;padding:9px 12px;border-radius:999px;font:inherit}
@media(max-width:600px){nav button{padding:8px 9px;font-size:.85rem}.who{min-width:56px}}
</style>
</head>

const LV=['A1','A2','B1','B2','C1','C2'];SCENES.sort((a,b)=>LV.indexOf(a.level)-LV.indexOf(b.level));

/* ======================= ÉTAT ======================= */
const $=s=>document.querySelector(s);
const store={
 get(k,d){try{return JSON.parse(localStorage.getItem('spp_'+k))??d}catch(e){return d}},
 set(k,v){try{localStorage.setItem('spp_'+k,JSON.stringify(v))}catch(e){}}
};
let state={view:'home',scene:null,showTr:false,rate:1,level:'all',blur:false,lv:'all'};
let vocab=store.get('vocab',[]);        // [{w,def,ex,session,sceneId,box,added}]
let done=store.get('done',{});          // sceneId -> best quiz score
let videos=store.get('videos',{});      // sceneId -> youtube id
if(store.get('theme')==='light')document.documentElement.classList.add('light');

/* ======================= AUDIO (Web Speech) ======================= */
let voices=[];
function loadVoices(){voices=speechSynthesis.getVoices().filter(v=>v.lang.startsWith('en'))}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function speak(text,onend,onb){
 if(!('speechSynthesis' in window)){alert("Synthèse vocale non disponible sur ce navigateur.");return}
 speechSynthesis.cancel();
 const u=new SpeechSynthesisUtterance(text);
 const pick=voices.find(v=>v.name===store.get('voice',''))||voices.find(v=>v.lang==='en-GB')||voices.find(v=>v.lang==='en-US')||voices[0];
 if(pick)u.voice=pick;u.lang=pick?pick.lang:'en-GB';u.rate=state.rate;
 u.onend=onend;if(onb)u.onboundary=onb;speechSynthesis.speak(u);
}

/* ======================= NAVIGATION ======================= */
function go(v,sc){state.view=v;if(sc!==undefined)state.scene=sc;if('speechSynthesis' in window)speechSynthesis.cancel();closePanel();render();scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.v));
$('#theme').onclick=()=>{const l=document.documentElement.classList.toggle('light');store.set('theme',l?'light':'dark');$('#theme').textContent=l?'☀️':'🌙'};
function render(){
 document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===state.view||(state.view==='scene'&&b.dataset.v==='home')));
 ({home:renderHome,scene:renderScene,vocab:renderVocab,review:renderReview,quiz:renderQuiz,dict:renderDict,cloze:renderCloze,lexicon:renderLex})[state.view]();
}

 <h1>Apprends l'anglais en vivant les scènes 🎬</h1>

 ${wotdHtml()}

  </div>`}).join('')}</div>
 <div class="row" style="margin-top:30px;justify-content:center">
  <button class="btn ghost small" onclick="exportAll()">⬇ Sauvegarder ma progression</button>

 </div>`;
}

function ytId(u){const m=u.match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);return m?m[1]:/^[\w-]{11}$/.test(u)?u:null}
function renderScene(){
 const s=SCENES.find(x=>x.id===state.scene);const vid=videos[s.id];

  <button class="btn ghost small" onclick="state.blur=!state.blur;renderScene()">${state.blur?'Voir':'Cacher'} le texte anglais 🎧</button>
  ${voiceSel()}<select onchange="state.rate=+this.value">
   ${[.7,.85,1,1.15].map(r=>`<option value="${r}" ${state.rate===r?'selected':''}>Vitesse ×${r}</option>`).join('')}
  </select>
 </div>
 <div class="${state.showTr?'showtr':''}${state.blur?' blur':''}" id="lines">
 ${s.lines.map((l,i)=>`<div class="line" id="L${i}">
   <div class="who">${l[0]}</div>
   <div class="txt"><span class="e">${tokenize(l[1],kw,s.id)}</span><div class="tr">${s.tr[i]}</div></div>

let dc={s:null,i:0,sc:[]};
function startDict(sid){dc={s:SCENES.find(x=>x.id===sid),i:0,sc:[]};go('dict')}
function cleanW(w){return w.toLowerCase().replace(/[’]/g,"'").replace(/[^a-z0-9']/g,'')}
function lcsKeep(a,b){const m=a.length,n=b.length,d=Array.from({length:m+1},()=>Array(n+1).fill(0));
 for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=a[i-1]===b[j-1]?d[i-1][j-1]+1:Math.max(d[i-1][j],d[i][j-1]);
 const keep=new Set();let i=m,j=n;while(i>0&&j>0){if(a[i-1]===b[j-1]){keep.add(i-1);i--;j--}else if(d[i-1][j]>=d[i][j-1])i--;else j--}return keep}
function renderDict(){
 const {s,i}=dc,n=s.lines.length;
 if(i>=n){touchStreak();const avg=Math.round(dc.sc.reduce((a,b)=>a+b,0)/dc.sc.length);
  $('#app').innerHTML=`<h1>Dictée terminée</h1><div class="card" style="text-align:center"><h2>${avg} %</h2><p class="sub">${avg>=90?'Oreille d\'expert ! 🏆':avg>=60?'Bien joué, réécoute la scène pour progresser.':'Continue : écoute la scène plusieurs fois, puis recommence.'}</p><div class="row" style="justify-content:center"><button class="btn" onclick="startDict('${s.id}')">Recommencer</button><button class="btn ghost" onclick="go('scene','${s.id}')">Retour à la scène</button></div></div>`;return}
 $('#app').innerHTML=`<button class="back-link" onclick="go('scene','${s.id}')">← ${s.title}</button>
 <h1>Dictée ✍️</h1><p class="sub">Phrase ${i+1} / ${n} — écoute, puis écris ce que tu entends.</p>
 <div class="card">
  <div class="row" style="margin-bottom:12px">
   <button class="btn small" onclick="speak(dc.s.lines[dc.i][1])">🔊 Écouter</button>
   <button class="btn ghost small" onclick="slowSay()">🐢 Lentement</button>
  </div>
  <textarea id="dt" rows="3" placeholder="Tape ici ce que tu entends…" autocomplete="off" spellcheck="false"></textarea>
  <div class="row" style="margin-top:10px"><button class="btn" id="chk" onclick="checkDict()">Vérifier</button></div>
  <div id="dres" style="margin-top:14px"></div>
 </div>`;
 setTimeout(()=>speak(s.lines[i][1]),300);
}
function slowSay(){const r=state.rate;state.rate=.65;speak(dc.s.lines[dc.i][1]);state.rate=r}
function checkDict(){
 const {s,i}=dc;const orig=s.lines[i][1].split(/\s+/);const exp=orig.map(cleanW);
 const usr=$('#dt').value.split(/\s+/).map(cleanW).filter(Boolean);
 const keep=lcsKeep(exp,usr);const score=Math.round(keep.size/exp.length*100);dc.sc.push(score);
 $('#chk').disabled=true;
 $('#dres').innerHTML=`<p><b>${score} %</b> — ${score===100?'Parfait ! ✅':'les mots en rouge ont été manqués'}</p>
  <p style="font-size:1.1rem;margin:8px 0">${orig.map((w,k)=>`<span class="${keep.has(k)?'okw':'kow'}">${w}</span>`).join(' ')}</p>
  <p class="sub">${s.tr[i]}</p>
  <button class="btn" onclick="dc.i++;renderDict()">${i+1>=s.lines.length?'Voir le résultat':'Phrase suivante →'}</button>`;
}

function lexTag(l){return `<span class="tag lv-${l[0][0]}">${l[0]}</span>`}
function wotdHtml(){
 const i=Math.floor(Date.now()/864e5)%LEX.length,l=LEX[i];
 return `<div class="card" style="margin-bottom:18px"><div class="row"><b>💡 Mot du jour</b>${lexTag(l)}<span class="tag">${l[4]}</span></div>
  <h2 style="margin:8px 0 2px">${l[1]}</h2><p class="sub" style="margin:0 0 10px">${l[2]} — <i>${l[3]}</i></p>
  <div class="row"><button class="play" onclick="speak(LEX[${i}][1])">🔊</button><button class="play" title="Écouter l'exemple" onclick="speak(LEX[${i}][3])">💬</button>
  <button class="btn ghost small" onclick="saveLex(${i},this)">${isSaved(l[1])?'✓ Enregistré':'＋ Enregistrer'}</button>
  <button class="btn small" onclick="go('lexicon')">Voir le lexique →</button></div></div>`;
}
function saveLex(i,btn){const l=LEX[i];if(!isSaved(l[1]))addWord(l[1],l[2],l[3],LEXS);if(btn)btn.textContent='✓ Enregistré'}
function saveLexAll(){LEX.forEach((l,i)=>{if((state.lv==='all'||l[0]===state.lv)&&!isSaved(l[1]))addWord(l[1],l[2],l[3],LEXS)});renderLex()}
function lexFilter(q){q=q.toLowerCase();document.querySelectorAll('.lexcard').forEach(e=>e.style.display=e.textContent.toLowerCase().includes(q)?'':'none')}
function renderLex(){
 const list=LEX.map((l,i)=>[l,i]).filter(([l])=>state.lv==='all'||l[0]===state.lv);
 $('#app').innerHTML=`<h1>Lexique avancé 🧠</h1><p class="sub">${LEX.length} mots et expressions utiles mais peu connus, de B2 à C2. Écoute, enregistre, révise.</p>
 <div class="chips">${['all','B2','C1','C2'].map(l=>`<button class="chip ${state.lv===l?'on':''}" onclick="state.lv='${l}';renderLex()">${l==='all'?'Tous':l}</button>`).join('')}</div>
 <div class="row" style="margin-bottom:16px"><input class="vs" placeholder="Rechercher un mot…" oninput="lexFilter(this.value)">
  <button class="btn small" onclick="startLexQuiz()">Quiz 🎯</button>
  <button class="btn ghost small" onclick="saveLexAll()">Tout enregistrer (${list.length})</button></div>
 <div class="grid">${list.map(([l,i])=>`<div class="card lexcard">
  <div class="row"><b class="lexw">${l[1]}</b>${lexTag(l)}<span class="tag">${l[4]}</span></div>
  <p class="def">${l[2]}</p><p><i>${l[3]}</i></p>
  <div class="row" style="margin-top:10px"><button class="play" onclick="speak(LEX[${i}][1])">🔊</button>
  <button class="play" title="Écouter l'exemple" onclick="speak(LEX[${i}][3])">💬</button>
  <button class="btn ghost small" onclick="saveLex(${i},this)">${isSaved(l[1])?'✓ Enregistré':'＋ Enregistrer'}</button></div></div>`).join('')}</div>`;
}
function startLexQuiz(){
 const pool=LEX.filter(l=>state.lv==='all'||l[0]===state.lv).sort(()=>Math.random()-.5).slice(0,10);
 const quiz=pool.map(l=>{
  const others=LEX.filter(o=>o[1]!==l[1]&&o[2]!==l[2]).sort(()=>Math.random()-.5).slice(0,2).map(o=>[o[2],false]);
  const opts=[[l[2],true],...others].sort(()=>Math.random()-.5);
  return [`Que signifie « ${l[1]} » ?`,opts.map(o=>o[0]),opts.findIndex(o=>o[1])];
 });
 qz={s:{...LEXS,quiz},i:0,score:0,locked:false};go('quiz');
}
function extraWords(s){
 if(!['B2','C1','C2'].includes(s.level))return'';
 const idx=LEX.map((l,i)=>i).filter(i=>LEX[i][0]===s.level);
 const k=SCENES.filter(x=>x.level===s.level).findIndex(x=>x.id===s.id);
 const pick=[0,1,2,3,4,5].map(j=>idx[(k*6+j)%idx.length]);
 return `<h2>Pour aller plus loin ✨</h2><p class="sub">Mots utiles et peu connus du niveau ${s.level}, à glisser dans tes phrases.</p>
 <div class="card">${pick.map(i=>`<div class="vitem"><button class="play" onclick="speak(LEX[${i}][1])">🔊</button>
  <div class="l"><b>${LEX[i][1]}</b><small>${LEX[i][2]} — <i>${LEX[i][3]}</i></small></div>
  <button class="btn ghost small" onclick="saveLex(${i},this)">${isSaved(LEX[i][1])?'✓ Enregistré':'＋ Enregistrer'}</button></div>`).join('')}</div>`;
}

$('#theme').textContent=document.documentElement.classList.contains('light')?'☀️':'🌙';
render();
/* Installation / hors connexion (uniquement en ligne, en https) */
if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
